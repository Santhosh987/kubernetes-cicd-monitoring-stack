<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Monitoring Project</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #ffffff;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .container {
            max-width: 700px;
            padding: 40px 24px;
        }

        h1 {
            color: #60a5fa;
            font-size: 2.5rem;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 8px;
            background: #14532d;
            color: #bbf7d0;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>DevOps Monitoring Project</h1>
        <p>
            A cloud-native website deployed using Kubernetes and Helm,
            automated with GitHub Actions, and monitored using Prometheus
            and Grafana.
        </p>
        <div class="status">Website is running successfully</div>
    </main>
</body>
</html>
